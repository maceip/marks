[package]
name = "marks-server"
version = "0.1.0"
description = "The one Marks HTTP/WebSocket process: identity, ACLs, and durable ESBT document rooms"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marks-auth = { path = "../marks-auth" }
# The authoritative ESBT sequence CRDT (Mechaoui & Imine, arXiv:2607.28101).
# Pinned to an exact revision: wire formats are part of the trust boundary.
esbt = { git = "https://github.com/maceip/ESBT-web", rev = "7f2fe48a36e4b2e086bc2b678cf8029387700393" }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }

base64ct.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
p256.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.28"
