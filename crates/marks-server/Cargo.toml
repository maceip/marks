[package]
name = "marks-server"
version = "0.1.0"
description = "The one Marks HTTP/WebSocket process: identity, ACLs, and durable ESBT document rooms"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Shipping variants select server capabilities explicitly. Keeping the default
# empty makes a plain/stable build physically omit the hosted-agent gateway.
default = []
agent-chat = ["dep:async-trait"]

[dependencies]
marks-auth = { path = "../marks-auth" }
# The authoritative ESBT sequence CRDT (Mechaoui & Imine, arXiv:2607.28101).
# Pinned to an exact revision: wire formats are part of the trust boundary.
esbt = { git = "https://github.com/maceip/ESBT-web", rev = "40a1771343a08d8d74a7e2007b0233a6878f4fa1" }

axum = { version = "0.8", features = ["ws"] }
aho-corasick = "1"
async-trait = { version = "0.1", optional = true }
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.7", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
htmd = "0.5.5"
libc = "0.2"
office_oxide = "0.1.8"
pdf-extract = "0.12.0"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

base64ct.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
p256.workspace = true
tokio-tungstenite = "0.28"

[build-dependencies]
serde_json = "1"
sha2.workspace = true

[[test]]
name = "agent_gateway"
path = "tests/agent_gateway.rs"
required-features = ["agent-chat"]
