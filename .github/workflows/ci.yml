# What this workflow is for:
#   `test` — compile, format, typecheck, unit/integration suites that do not
#   start the production binary (including in-process room_collab).
#   `service-collab` — a live marks-server, a VITE_MARKS_DATA_MODE=service
#   client, Playwright /v1 first-paint, and two native ESBT peers converging
#   on the UI-created document. A green workflow is proof of those two things.
#
# What it is not:
#   `npm run test:harness` is helper-unit tests. `smoke` / `smoke:platforms`
#   stay local: they are the two-browser preview-sync run of the Wasm
#   CollabSession. CI proves native multi-peer rooms plus Wasm plumbing
#   units, not two live browsers painting the same document.
#   Floating `stable` is forbidden: pin rust-toolchain.toml / rust-version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject retired Node server workspace
        run: |
          if [ -f server/package.json ] || [ -d server/src ] || [ -f scripts/harness/ensure-server.mjs ]; then
            echo "The Node server/ workspace is retired. Marks has one Rust process." >&2
            echo "Do not reintroduce server/, or harness code that starts npm start." >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Refuse rustc drift from rust-version
        run: |
          rustc -vV
          cargo -vV
          pinned="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)"
          release="$(rustc -vV | awk '/^release:/{print $2}')"
          echo "Cargo.toml rust-version=${pinned} rustc=${release}"
          if [ -z "${pinned}" ]; then
            echo "workspace rust-version is missing from Cargo.toml" >&2
            exit 1
          fi
          case "${release}" in
            "${pinned}"|"${pinned}".*) ;;
            *)
              echo "CI rustc ${release} does not match workspace rust-version ${pinned}." >&2
              echo "Pin .github/workflows/ci.yml and rust-toolchain.toml together." >&2
              exit 1
              ;;
          esac

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: Rust workspace lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESBT tests
        run: npm run test:esbt

      - name: Browser unit tests
        run: npm run test:browser

      - name: Markdown renderer tests
        run: npm run test:markdown

      - name: Wasm client plumbing tests
        run: npm run test:wasm

      - name: Browser auth protocol tests
        run: npm run test:auth

      - name: Harness helper unit tests
        run: npm run test:harness

      - name: Production client build
        run: npm run build

      - name: Production UI budgets
        run: npm run check:ui-budgets

      - name: Rust multi-peer room collaboration
        run: cargo test -p marks-server --test room_collab --locked

  service-collab:
    name: service-mode and multi-peer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build marks-server
        run: cargo build -p marks-server --locked

      - name: Production service-mode client
        run: VITE_MARKS_DATA_MODE=service npm run build

      - name: Production UI budgets (service-mode)
        run: npm run check:ui-budgets

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Live server, service UI, and two-peer room
        run: bash scripts/run-service-ci.sh --bin target/debug/marks-server --static-dir client/dist
