# What this workflow is for:
#   `test` — compile, format, typecheck, unit/integration suites that do not
#   start the production binary (including in-process room_collab).
#   `service-collab` — a live marks-server, a VITE_MARKS_DATA_MODE=service
#   client, Playwright artifact/admission/two-browser/durable-edit/reload/
#   offline/import proof in Chromium, Firefox, and WebKit, and two native ESBT
#   peers converging on the UI-created document.
#
# What it is not:
#   `npm run test:harness` is helper-unit tests. `smoke:platforms` stays local.
#   CI proves isolated browser replicas, native multi-peer rooms, and Wasm
#   plumbing units. The scheduled workflow separately reruns the Chromium
#   release shape and enforces large-document UI budgets.
#   Floating `stable` is forbidden: pin rust-toolchain.toml / rust-version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Reject retired duplicate implementations
        run: |
          if [ -f server/package.json ] || [ -d server/src ] || [ -f scripts/harness/ensure-server.mjs ]; then
            echo "The Node server/ workspace is retired. Marks has one Rust process." >&2
            echo "Do not reintroduce server/, or harness code that starts npm start." >&2
            exit 1
          fi
          if [ -d esbt ]; then
            echo "The TypeScript CRDT workspace is retired. Rust ESBT is the only document engine." >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Refuse rustc drift from rust-version
        run: |
          rustc -vV
          cargo -vV
          pinned="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)"
          release="$(rustc -vV | awk '/^release:/{print $2}')"
          echo "Cargo.toml rust-version=${pinned} rustc=${release}"
          if [ -z "${pinned}" ]; then
            echo "workspace rust-version is missing from Cargo.toml" >&2
            exit 1
          fi
          case "${release}" in
            "${pinned}"|"${pinned}".*) ;;
            *)
              echo "CI rustc ${release} does not match workspace rust-version ${pinned}." >&2
              echo "Pin .github/workflows/ci.yml and rust-toolchain.toml together." >&2
              exit 1
              ;;
          esac

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: Rust workspace lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Setup Node.js v22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify checked-in ESBT artifact identity and ABI
        run: npm run verify:esbt

      - name: Browser unit tests
        run: npm run test:browser

      - name: Product boundary unit tests
        run: npm run test:surface

      - name: Markdown renderer tests
        run: npm run test:markdown

      - name: Benchmark fixture and receipt tests
        run: npm run test:bench

      - name: Wasm client plumbing tests
        run: npm run test:wasm

      - name: Browser auth protocol tests
        run: npm run test:auth

      - name: Harness helper unit tests
        run: npm run test:harness

      - name: Production client build
        run: npm run build

      - name: Production UI budgets
        run: npm run check:ui-budgets

      - name: Rust multi-peer room collaboration
        run: cargo test -p marks-server --test room_collab --locked

  service-collab:
    name: service-mode ${{ matrix.browser }} and multi-peer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Setup Node.js v22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build marks-server
        run: cargo build -p marks-server --locked
        env:
          MARKS_BUILD_REVISION: ${{ github.sha }}
          MARKS_SOURCE_DIRTY: '0'

      - name: Production service-mode client
        run: VITE_MARKS_DATA_MODE=service VITE_MARKS_TEST_SERVICE_WORKER=1 npm run build

      - name: Production UI budgets (service-mode)
        run: npm run check:ui-budgets

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Live server, service UI, and two-peer room
        run: bash scripts/run-service-ci.sh --bin target/debug/marks-server --static-dir client/dist --browser ${{ matrix.browser }}
        env:
          MARKS_BROWSER: ${{ matrix.browser }}
          MARKS_REQUIRE_RELEASE: '1'
          MARKS_TEST_SERVICE_WORKER: '1'
