# What this workflow is for:
#   Fail a PR before merge when the workspace does not compile, format, typecheck,
#   or pass the unit/integration suites that run without a browser or a running
#   server. That is the set that caught main going red when marks-server drifted
#   off marks-auth.
#
# What it is not:
#   `npm run test:harness` is helper-unit tests (chrome discovery, budget parsers,
#   wait-for-server). It is not `smoke` / `smoke:platforms`. Those need a running
#   app and stay local until service-mode room bytes exist.
#   Floating `stable` is forbidden here: local rust-version is 1.88; Actions
#   `stable` was 1.98 and turned Clippy style into a false product failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject retired Node server workspace
        run: |
          if [ -f server/package.json ] || [ -d server/src ] || [ -f scripts/harness/ensure-server.mjs ]; then
            echo "The Node server/ workspace is retired. Marks has one Rust process." >&2
            echo "Do not reintroduce server/, or harness code that starts npm start." >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Refuse rustc drift from rust-version
        run: |
          rustc -vV
          cargo -vV
          pinned="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)"
          release="$(rustc -vV | awk '/^release:/{print $2}')"
          echo "Cargo.toml rust-version=${pinned} rustc=${release}"
          if [ -z "${pinned}" ]; then
            echo "workspace rust-version is missing from Cargo.toml" >&2
            exit 1
          fi
          case "${release}" in
            "${pinned}"|"${pinned}".*) ;;
            *)
              echo "CI rustc ${release} does not match workspace rust-version ${pinned}." >&2
              echo "Pin .github/workflows/ci.yml and rust-toolchain.toml together." >&2
              exit 1
              ;;
          esac

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: Rust workspace lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESBT tests
        run: npm run test:esbt

      - name: Browser unit tests
        run: npm run test:browser

      - name: Markdown renderer tests
        run: npm run test:markdown

      - name: Wasm client plumbing tests
        run: npm run test:wasm

      - name: Browser auth protocol tests
        run: npm run test:auth

      - name: Harness helper unit tests
        run: npm run test:harness

      - name: Production client build
        run: npm run build

      - name: Production UI budgets
        run: npm run check:ui-budgets
