# Privileged production orchestration is deliberately separate from the
# pull-request-capable CI workflow. It executes repository code only after a
# successful same-repository push run of CI on main, or from an explicit
# workflow_dispatch on main.
name: Production deploy and rollback
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && 'Production rollback' || 'Production standard' }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        default: rollback
        type: choice
        options:
          - rollback
          - deploy
          - status
          - releases
      release_id:
        description: Optional retained release id for rollback; empty selects previous
        required: false
        type: string

permissions: {}

# Deployment and rollback both mutate the same current/previous release links.
# Standard operations serialize in one lane; rollback has a distinct priority
# lane so an automatic deploy can never replace a pending rollback. Rollback
# explicitly cancels standard runs through the Actions API, while every new
# deploy waits for all noncompleted rollback runs before touching production.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && 'marks-production-rollback' || 'marks-production-standard' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' }}

jobs:
  production:
    # A dispatched CI run on main (used by dependabot auto-merge, whose
    # token cannot retrigger push workflows) is as trustworthy as a push
    # run: same repository, same branch, same gate. The impact comparison
    # below still skips deployment when the deployed release already
    # matches, so re-verification dispatches never churn production.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Manual full validation plus the host's deterministic npm, fetch, Docker,
    # SQLite/canary, readiness, and observation ceilings can legitimately
    # exceed two hours. Keep Actions above that bounded worst case; host-side
    # cleanup never relies on a remote job cancellation.
    timeout-minutes: 300
    permissions:
      contents: read
      # Only the two API steps below export GH_TOKEN to a shell. Checkout gets
      # its normal token input but declines persistence, so repository scripts
      # cannot reuse this grant through Git credentials.
      actions: write
    environment:
      name: Production
      url: https://marks.secure.build

    steps:
      - name: Preempt standard production runs for rollback
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v jq >/dev/null

          list_standard_runs() {
            gh api --paginate "/repos/$REPOSITORY/actions/workflows/production.yml/runs?per_page=100" |
              jq -s '[
                .[].workflow_runs[]
                | select(.display_title == "Production standard")
                | select(.status != "completed")
                | .id
              ]'
          }

          cancellation_deadline_seconds=120
          cancellation_deadline=$((SECONDS + cancellation_deadline_seconds))
          declare -A cancellation_requested=()
          while :; do
            standard_runs_json=$(list_standard_runs)
            standard_run_count=$(jq 'length' <<< "$standard_runs_json")
            [[ "$standard_run_count" =~ ^[0-9]+$ ]]
            if (( standard_run_count == 0 )); then
              break
            fi
            mapfile -t standard_run_ids < <(jq -r '.[]' <<< "$standard_runs_json")
            for run_id in "${standard_run_ids[@]}"; do
              if [[ -n "${cancellation_requested[$run_id]+requested}" ]]; then
                continue
              fi
              echo "Canceling standard production run $run_id in favor of rollback"
              if ! cancel_error=$(gh api --method POST \
                "/repos/$REPOSITORY/actions/runs/$run_id/cancel" 2>&1); then
                run_status=$(gh api "/repos/$REPOSITORY/actions/runs/$run_id" --jq .status)
                if [[ "$run_status" != completed ]]; then
                  printf '%s\n' "$cancel_error" >&2
                  exit 1
                fi
              fi
              cancellation_requested[$run_id]=1
            done
            if (( SECONDS >= cancellation_deadline )); then
              echo "$standard_run_count standard production run(s) did not cancel within ${cancellation_deadline_seconds}s" >&2
              exit 1
            fi
            # Re-list and cancel every newly visible standard run on each pass.
            # This closes eventual-consistency misses without waiting on a
            # standard run whose deploy gate is itself waiting for rollback.
            echo "Waiting for $standard_run_count standard production run(s) to finish cancellation"
            sleep 2
          done

      - name: Wait for rollback priority before deploy
        if: github.event_name == 'workflow_run' || inputs.operation == 'deploy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v jq >/dev/null
          rollback_priority_deadline_seconds=900
          rollback_priority_deadline=$((SECONDS + rollback_priority_deadline_seconds))
          while :; do
            rollback_run_count=$(
              gh api --paginate "/repos/$REPOSITORY/actions/workflows/production.yml/runs?per_page=100" |
                jq -s '[
                  .[].workflow_runs[]
                  | select(.display_title == "Production rollback")
                  | select(.status != "completed")
                ] | length'
            )
            [[ "$rollback_run_count" =~ ^[0-9]+$ ]]
            if (( rollback_run_count == 0 )); then
              break
            fi
            if (( SECONDS >= rollback_priority_deadline )); then
              echo "rollback still owns production priority after ${rollback_priority_deadline_seconds}s" >&2
              exit 1
            fi
            echo "Waiting for $rollback_run_count priority rollback run(s) to finish"
            sleep 5
          done

      - name: Check out the trusted production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          # status, releases, and rollback never read Git history, so they
          # take a depth-one checkout; deployment keeps complete history for
          # the deployed-to-head impact comparison.
          fetch-depth: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy') && 1 || 0 }}

      - name: Resolve and validate the production request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            operation=deploy
            release_id=""
            [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "CI supplied an invalid tested revision" >&2
              exit 1
            }
            [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]] || {
              echo "checkout does not match the successful CI revision" >&2
              exit 1
            }
          else
            operation=$REQUESTED_OPERATION
            release_id=$REQUESTED_RELEASE_ID
            case "$operation" in
              deploy|rollback|status|releases) ;;
              *)
                echo "unsupported production operation: $operation" >&2
                exit 2
                ;;
            esac
            if [[ -n "$release_id" && "$operation" != rollback ]]; then
              echo "release_id is valid only for rollback" >&2
              exit 2
            fi
            release_id_pattern='^[0-9a-f]{40}\.stable\.[0-9a-f]{64}$'
            if [[ -n "$release_id" && ! "$release_id" =~ $release_id_pattern ]]; then
              echo "release_id must be one retained stable v2 release identity; leave it empty to select previous" >&2
              exit 2
            fi
          fi

          {
            printf 'operation=%s\n' "$operation"
            printf 'release_id=%s\n' "$release_id"
            printf 'revision=%s\n' "$(git rev-parse HEAD)"
            printf 'ci_run_id=%s\n' "$TESTED_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js v24
        if: steps.request.outputs.operation == 'deploy'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve the fixed production product build plan
        id: product
        if: steps.request.outputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          variant=stable
          digest=$(node --experimental-strip-types scripts/product-variant.ts resolve \
            --variant "$variant" --data-mode service \
            --format sha256 --require-deployable)
          plan=$(node --experimental-strip-types scripts/product-variant.ts resolve \
            --variant "$variant" --data-mode service \
            --format canonical --require-deployable)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(PLAN_JSON="$plan" node -e 'process.stdout.write(JSON.parse(process.env.PLAN_JSON).productVariant)' )" == "$variant" ]]
          {
            printf 'variant=%s\n' "$variant"
            printf 'build_plan_sha256=%s\n' "$digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Requested production build identity'
            echo
            echo "- Product variant: \`$variant\`"
            echo "- Build plan SHA-256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure pinned deployment SSH identity
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.MARKS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MARKS_DEPLOY_KNOWN_HOSTS }}
          REQUESTED_OPERATION: ${{ steps.request.outputs.operation }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_PRIVATE_KEY" ]] || {
            echo "MARKS_DEPLOY_SSH_KEY is not configured" >&2
            exit 1
          }
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]] || {
            echo "MARKS_DEPLOY_KNOWN_HOSTS is not configured" >&2
            exit 1
          }

          install -d -m 0700 "$HOME/.ssh"
          key_path="$RUNNER_TEMP/marks-deploy-ed25519"
          public_key_path="$RUNNER_TEMP/marks-deploy-ed25519.pub"
          known_hosts_path="$HOME/.ssh/known_hosts"
          config_path="$HOME/.ssh/config"
          umask 077
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$key_path"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_path"
          ssh-keygen -y -P '' -f "$key_path" > "$public_key_path" || {
            echo "MARKS_DEPLOY_SSH_KEY must be a valid passphrase-free OpenSSH private key" >&2
            exit 1
          }
          ssh-keygen -F secure.build -f "$known_hosts_path" >/dev/null || {
            echo "MARKS_DEPLOY_KNOWN_HOSTS does not pin secure.build" >&2
            exit 1
          }
          {
            echo 'Host secure.build'
            echo '  HostName secure.build'
            echo '  User marks-deploy'
            echo "  IdentityFile $public_key_path"
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
            echo '  StrictHostKeyChecking yes'
            echo '  ClearAllForwardings yes'
            echo '  RequestTTY no'
            echo "  UserKnownHostsFile $known_hosts_path"
          } > "$config_path"
          chmod 0600 "$config_path" "$known_hosts_path" "$key_path" "$public_key_path"
          eval "$(ssh-agent -s)"
          ssh-add "$key_path"
          rm -f -- "$key_path"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [[ "$REQUESTED_OPERATION" == deploy ]]; then
            # Deploy requires the helper's bounded-build-filesystem proof.
            ssh -o ConnectTimeout=15 secure.build probe
          else
            # Status/releases/rollback stay available if the disposable build
            # mount is offline. This still proves the pinned key, host, forced
            # command, sudo boundary, and root helper are reachable.
            ssh -o ConnectTimeout=15 secure.build status >/dev/null
          fi

      - name: Determine deployed-to-head runtime impact
        id: impact
        if: steps.request.outputs.operation == 'deploy'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVISION: ${{ steps.request.outputs.revision }}
          REQUESTED_VARIANT: ${{ steps.product.outputs.variant }}
          REQUESTED_PLAN_SHA256: ${{ steps.product.outputs.build_plan_sha256 }}
        run: |
          set -euo pipefail
          status_receipt=$(ssh secure.build status)
          printf '%s\n' "$status_receipt"
          current=$(awk '$1 == "current:" { print $2 }' <<< "$status_receipt")
          current_revision=$(awk '$1 == "revision:" { print $2 }' <<< "$status_receipt")
          current_variant=$(awk '$1 == "product-variant:" { print $2 }' <<< "$status_receipt")
          current_plan_sha256=$(awk '$1 == "build-plan-sha256:" { print $2 }' <<< "$status_receipt")
          [[ -n "$current" ]] || {
            echo "restricted status did not report the current release" >&2
            exit 1
          }

          # Releases created before the v2 product-build receipt use the Git
          # revision itself as `current` and have no top-level `revision:`
          # field. Preserve that trusted comparison base; the reachability
          # check below still rejects an unknown or malformed revision.
          if [[ -z "$current_revision" && "$current" =~ ^[0-9a-f]{40}$ ]]; then
            current_revision=$current
          fi

          [[ "$REQUESTED_VARIANT" == stable && "$REQUESTED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          profile=manual-full
          runtime_changed=true
          should_deploy=true
          reasons=manual-deploy
          if [[ "$current_revision" == "$REVISION" \
            && "$current_variant" == "$REQUESTED_VARIANT" \
            && "$current_plan_sha256" == "$REQUESTED_PLAN_SHA256" ]]; then
            profile=already-active
            runtime_changed=false
            should_deploy=false
            reasons=exact-build-identity-already-active
          elif [[ "$EVENT_NAME" == workflow_run ]]; then
            if [[ "$current_revision" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${current_revision}^{commit}"; then
              impact_output="$RUNNER_TEMP/marks-production-impact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              : > "$impact_output"
              node scripts/ci-impact.mjs \
                --base "$current_revision" \
                --head "$REVISION" \
                --github-output "$impact_output"
              profile=$(awk -F= '$1 == "profile" { print substr($0, index($0, "=") + 1) }' "$impact_output")
              runtime_changed=$(awk -F= '$1 == "runtime_changed" { print $2 }' "$impact_output")
              reasons=$(awk -F= '$1 == "reasons" { print substr($0, index($0, "=") + 1) }' "$impact_output")
              rm -f -- "$impact_output"
              [[ "$runtime_changed" == true || "$runtime_changed" == false ]]
              if [[ "$current_variant" != "$REQUESTED_VARIANT" \
                || "$current_plan_sha256" != "$REQUESTED_PLAN_SHA256" ]]; then
                reasons="$reasons,product-build-identity-changed"
              fi
              if [[ "$runtime_changed" == false \
                && "$current_variant" == "$REQUESTED_VARIANT" \
                && "$current_plan_sha256" == "$REQUESTED_PLAN_SHA256" ]]; then
                should_deploy=false
              fi
            elif [[ "$current" == legacy-* ]]; then
              profile=first-release
              reasons=legacy-current
            else
              echo "current release is neither a reachable Git revision nor legacy: $current" >&2
              exit 1
            fi
          fi

          {
            printf 'current=%s\n' "$current"
            printf 'current_revision=%s\n' "$current_revision"
            printf 'current_variant=%s\n' "$current_variant"
            printf 'current_plan_sha256=%s\n' "$current_plan_sha256"
            printf 'profile=%s\n' "$profile"
            printf 'runtime_changed=%s\n' "$runtime_changed"
            printf 'should_deploy=%s\n' "$should_deploy"
            printf 'reasons=%s\n' "$reasons"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain for a manual full deploy
        if: >-
          github.event_name == 'workflow_dispatch' &&
          steps.request.outputs.operation == 'deploy' &&
          steps.impact.outputs.should_deploy == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # immutable action revision
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Deploy the exact successful CI revision without a duplicate local gate
        if: >-
          github.event_name == 'workflow_run' &&
          steps.request.outputs.operation == 'deploy' &&
          steps.impact.outputs.should_deploy == 'true'
        shell: bash
        env:
          MARKS_CI_VERIFIED_SHA: ${{ steps.request.outputs.revision }}
          MARKS_CI_VERIFIED_VARIANT: ${{ steps.product.outputs.variant }}
          MARKS_CI_VERIFIED_PLAN_SHA256: ${{ steps.product.outputs.build_plan_sha256 }}
          MARKS_CI_RUN_ID: ${{ steps.request.outputs.ci_run_id }}
        run: >-
          bash scripts/deploy-secure-build.sh deploy-verified
          "$MARKS_CI_VERIFIED_SHA"
          "$MARKS_CI_VERIFIED_VARIANT"
          "$MARKS_CI_VERIFIED_PLAN_SHA256"

      - name: Run the complete gate for a manual deploy
        if: >-
          github.event_name == 'workflow_dispatch' &&
          steps.request.outputs.operation == 'deploy' &&
          steps.impact.outputs.should_deploy == 'true'
        run: npm run deploy:secure-build

      - name: Skip application deployment when no runtime artifact changed
        if: >-
          steps.request.outputs.operation == 'deploy' &&
          steps.impact.outputs.should_deploy == 'false'
        shell: bash
        run: |
          echo "CI passed; the requested stable build is already active or the revision contains no runtime change."
          echo "Production remains on ${{ steps.impact.outputs.current }}."

      - name: Fast rollback to previous or a retained release
        if: steps.request.outputs.operation == 'rollback'
        shell: bash
        env:
          RELEASE_ID: ${{ steps.request.outputs.release_id }}
        run: |
          set -euo pipefail
          lock_error='marks-release-root: another Marks deployment or rollback holds the release lock'
          rollback_retry_deadline_seconds=300
          rollback_retry_deadline=$((SECONDS + rollback_retry_deadline_seconds))
          rollback_retry_delay=2

          while :; do
            if [[ -n "$RELEASE_ID" ]]; then
              if rollback_output=$(bash scripts/deploy-secure-build.sh rollback "$RELEASE_ID" 2>&1); then
                printf '%s\n' "$rollback_output"
                break
              else
                rollback_status=$?
              fi
            else
              if rollback_output=$(bash scripts/deploy-secure-build.sh rollback 2>&1); then
                printf '%s\n' "$rollback_output"
                break
              else
                rollback_status=$?
              fi
            fi

            printf '%s\n' "$rollback_output" >&2
            if [[ "$rollback_output" != "$lock_error" ]]; then
              exit "$rollback_status"
            fi
            if (( SECONDS >= rollback_retry_deadline )); then
              echo "rollback could not acquire the host release lock within ${rollback_retry_deadline_seconds}s" >&2
              exit "$rollback_status"
            fi

            rollback_retry_remaining=$((rollback_retry_deadline - SECONDS))
            if (( rollback_retry_delay > rollback_retry_remaining )); then
              rollback_retry_delay=$rollback_retry_remaining
            fi
            echo "host release lock is still draining after preemption; retrying rollback in ${rollback_retry_delay}s" >&2
            sleep "$rollback_retry_delay"
            if (( rollback_retry_delay < 20 )); then
              rollback_retry_delay=$((rollback_retry_delay * 2))
              if (( rollback_retry_delay > 20 )); then
                rollback_retry_delay=20
              fi
            fi
          done

      - name: Show production status
        if: steps.request.outputs.operation == 'status'
        run: bash scripts/deploy-secure-build.sh status

      - name: List retained releases
        if: steps.request.outputs.operation == 'releases'
        run: bash scripts/deploy-secure-build.sh releases

      # `status` is output; `verify` is a gate. It fails unless the
      # restricted status receipt, the public health and readiness
      # endpoints, and the public artifact receipt all agree on one
      # coherent, release-ready deployment.
      - name: Verify production after a state change
        if: >-
          success() &&
          ((steps.request.outputs.operation == 'deploy' &&
            steps.impact.outputs.should_deploy == 'true') ||
           steps.request.outputs.operation == 'rollback')
        run: bash scripts/deploy-secure-build.sh verify

      - name: Record production receipt
        if: success()
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          REVISION: ${{ steps.request.outputs.revision }}
          RELEASE_ID: ${{ steps.request.outputs.release_id }}
          PREVIOUS_REVISION: ${{ steps.impact.outputs.current }}
          IMPACT_PROFILE: ${{ steps.impact.outputs.profile }}
          RUNTIME_CHANGED: ${{ steps.impact.outputs.runtime_changed }}
          SHOULD_DEPLOY: ${{ steps.impact.outputs.should_deploy }}
          IMPACT_REASONS: ${{ steps.impact.outputs.reasons }}
          PRODUCT_VARIANT: ${{ steps.product.outputs.variant }}
          BUILD_PLAN_SHA256: ${{ steps.product.outputs.build_plan_sha256 }}
        run: |
          {
            echo '### Marks production operation'
            echo
            echo "- Operation: \`$OPERATION\`"
            echo "- Workflow revision: \`$REVISION\`"
            if [[ "$OPERATION" == deploy ]]; then
              echo "- Previously deployed: \`$PREVIOUS_REVISION\`"
              echo "- Impact profile: \`$IMPACT_PROFILE\`"
              echo "- Runtime changed: \`$RUNTIME_CHANGED\`"
              echo "- Deployment executed: \`$SHOULD_DEPLOY\`"
              echo "- Impact reasons: \`$IMPACT_REASONS\`"
              echo "- Product variant: \`$PRODUCT_VARIANT\`"
              echo "- Build plan SHA-256: \`$BUILD_PLAN_SHA256\`"
            fi
            if [[ -n "$RELEASE_ID" ]]; then
              echo "- Requested release: \`$RELEASE_ID\`"
            fi
            echo '- Origin: https://marks.secure.build'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove deployment credentials
        if: always()
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/marks-deploy-ed25519"
          public_key_path="$RUNNER_TEMP/marks-deploy-ed25519.pub"
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi
          rm -f -- "$key_path" "$public_key_path" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
