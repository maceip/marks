[workspace]
members = ["crates/marks-auth"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
base64ct = { version = "1.8.3", features = ["alloc"] }
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
url = "2.5.7"
